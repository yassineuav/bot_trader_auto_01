version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tradeai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  backend:
    build: ../backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    env_file:
      - .env.example
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
  worker:
    build: ../backend
    command: celery -A core worker -l info
    volumes:
      - ../backend:/app
    env_file:
      - .env.example
    depends_on:
      - backend
      - redis
  beat:
    build: ../backend
    command: celery -A core beat -l info
    volumes:
      - ../backend:/app
    env_file:
      - .env.example
    depends_on:
      - backend
  frontend:
    build: ../frontend
    command: npm run dev
    volumes:
      - ../frontend:/app
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
